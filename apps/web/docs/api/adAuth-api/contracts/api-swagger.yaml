        required: true
        schema:
          type: string
      - name: id
        in: path
        description: 功能ID
        required: true
        schema:
          type: string
      - name: includeGroup
        in: query
        description: 是否包含群組資訊
        schema:
          type: boolean
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FunctionDTO'
  /{urlshop}/Function/{subSystem}:
    get:
