          description: OK
  /ADAuth/Verify:
    post:
      summary: "(deprecated) replace by VerifyCert\r\nverify sso login status"
      requestBody:
        description: ''
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VerifyInfo'
