          type: boolean
          default: false
      - name: useEmpId
        in: query
        description: true表示empIdentity為員工ID，false表示為AD帳號，預設為true
        schema:
          type: boolean
          default: true
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HrEmployeeDTO'
