  /ADAuth/RefreshToken:
    get:
      summary: Get new JWT, refreshToken will be rotate too.
      parameters:
      - name: refreshToken
        in: query
        description: usually for test purpose
        schema:
          type: string
      responses:
        '200':
          description: OK
    post:
