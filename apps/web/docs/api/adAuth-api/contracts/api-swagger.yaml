      parameters:
      - name: urlshop
        in: path
        description: ''
        required: true
        schema:
          type: string
      - name: paramName
        in: path
        description: ''
        required: true
        schema:
          type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  type: string
  /{urlshop}/Dept/{deptCode}:
    get:
      summary: 取得部門資訊
      parameters:
      - name: urlshop
        in: path
        description: 工廠代碼
        required: true
        schema:
          type: string
      - name: deptCode
        in: path
        description: 部門代碼
        required: true
        schema:
          type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DepartmentDTO'
  /{urlshop}/Dept:
    get:
      summary: 取得部門清單
      parameters:
      - name: urlshop
        in: path
        description: 工廠代碼
        required: true
        schema:
          type: string
      - name: page
        in: query
        description: 頁碼，從0開始
        schema:
          type: integer
          format: int32
          default: 0
      - name: pageSize
        in: query
        description: 每頁筆數，最大5000
        schema:
          type: integer
          format: int32
          default: 5000
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Department'
    post:
      summary: 新增部門
      parameters:
      - name: urlshop
        in: path
        description: 工廠代碼
        required: true
        schema:
          type: string
      requestBody:
        description: 要新增的部門資料陣列
        content:
          application/json:
            schema:
              type: array
              items:
                $ref: '#/components/schemas/DepartmentDTO'
      responses:
        '200':
          description: OK
    put:
      summary: 更新部門
      parameters:
      - name: urlshop
        in: path
        description: 工廠代碼
        required: true
        schema:
          type: string
      requestBody:
        description: 要更新的部門資料陣列
        content:
          application/json:
            schema:
              type: array
              items:
                $ref: '#/components/schemas/DepartmentDTO'
      responses:
        '200':
          description: OK
    delete:
      summary: 刪除部門
      parameters:
      - name: urlshop
        in: path
