<header class="app-header">
  <div class="header-left">
    <button class="toggle-sidebar-btn" (click)="toggleSidebar()" aria-label="Toggle Sidebar">
      <svg
        width="20"
        height="20"
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="2"
      >
        <line x1="3" y1="12" x2="21" y2="12"></line>
        <line x1="3" y1="6" x2="21" y2="6"></line>
        <line x1="3" y1="18" x2="21" y2="18"></line>
      </svg>
    </button>
    <span class="app-title">{{ appTitle() }}</span>
  </div>

  <div class="header-right">
    @if (currentUser(); as user) {
      <div class="user-profile">
        <span class="user-name">{{ user.name }}</span>
        <span class="user-id">({{ user.id }})</span>
        <span class="user-shop">{{ user.orgShop || (user.shops && user.shops[0]) || 'FAB' }}</span>
      </div>

      <div class="user-menu-container">
        <button
          class="menu-trigger-btn"
          (click)="toggleUserMenu()"
          aria-label="選單"
          [attr.aria-expanded]="isUserMenuOpen()"
        >
          <svg
            width="20"
            height="20"
            viewBox="0 0 24 24"
            fill="currentColor"
            stroke="none"
          >
            <circle cx="12" cy="5" r="1.75"></circle>
            <circle cx="12" cy="12" r="1.75"></circle>
            <circle cx="12" cy="19" r="1.75"></circle>
          </svg>
        </button>

        @if (isUserMenuOpen()) {
          <div class="dropdown-menu">
            <button class="dropdown-action" (click)="openVersionInfo()">
              <svg
                width="16"
                height="16"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
                stroke-linecap="round"
                stroke-linejoin="round"
              >
                <circle cx="12" cy="12" r="10"></circle>
                <line x1="12" y1="16" x2="12" y2="12"></line>
                <line x1="12" y1="8" x2="12.01" y2="8"></line>
              </svg>
              <span>版本資訊</span>
            </button>
            <button class="dropdown-action dropdown-action-danger" (click)="logout()">
              <svg
                width="16"
                height="16"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
                stroke-linecap="round"
                stroke-linejoin="round"
              >
                <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path>
                <polyline points="16 17 21 12 16 7"></polyline>
                <line x1="21" y1="12" x2="9" y2="12"></line>
              </svg>
              <span>登出</span>
            </button>
          </div>
        }
      </div>
    }
  </div>
</header>

<div class="app-body">
  <aside class="sidebar" [class.collapsed]="isSidebarCollapsed()">
    <nav class="sidebar-nav">
      @for (item of navItems(); track item.route) {
        <a [routerLink]="item.route" routerLinkActive="active" class="sidebar-nav-item">
          <span class="nav-icon">
            @if (item.icon === 'dashboard') {
              <svg
                width="18"
                height="18"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
              >
                <rect x="3" y="3" width="7" height="7"></rect>
                <rect x="14" y="3" width="7" height="7"></rect>
                <rect x="14" y="14" width="7" height="7"></rect>
                <rect x="3" y="14" width="7" height="7"></rect>
              </svg>
            } @else {
              <svg
                width="18"
                height="18"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
              >
                <circle cx="12" cy="12" r="10"></circle>
                <polyline points="12 6 12 12 16 14"></polyline>
              </svg>
            }
          </span>
          <span class="nav-label">{{ item.label }}</span>
        </a>
      }
    </nav>
  </aside>

  <main class="main-viewport">
    <router-outlet></router-outlet>
  </main>
</div>

<app-footer />

<app-version-dialog />
